<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipo Prehistórico 5 · Guía de Gimnasios PokeMMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=ambar]{--bg:#0d0705;--bg2:#1a0d07;--pan:#1c1109;--line:#5a2c10;--acc:#ff8a1f;--acc2:#ffd23f;--txt:#f6e9de;--mut:#b99983;--glow:255,138,31}
[data-theme=cian]{--bg:#030b12;--bg2:#06182a;--pan:#08202f;--line:#0e4a66;--acc:#19e3ff;--acc2:#7cffd4;--txt:#e3f8ff;--mut:#7fb3c4;--glow:25,227,255}
[data-theme=plasma]{--bg:#0b0612;--bg2:#1a0b2b;--pan:#1e1033;--line:#52207f;--acc:#d64bff;--acc2:#ff5fa8;--txt:#f5e8ff;--mut:#b393cc;--glow:214,75,255}
[data-theme=matrix]{--bg:#030a05;--bg2:#06180b;--pan:#082010;--line:#10602a;--acc:#2dff7a;--acc2:#c6ff3d;--txt:#e6ffee;--mut:#79b58b;--glow:45,255,122}
[data-theme=hielo]{--bg:#e9f1f8;--bg2:#d5e4f1;--pan:#f8fbff;--line:#9db8d0;--acc:#0b6bd6;--acc2:#00a7a0;--txt:#0d2033;--mut:#4d6a85;--glow:11,107,214}
*{box-sizing:border-box;margin:0}
.w{font-synthesis:none}
html{scroll-behavior:smooth}
body{font:700 20px/1.45 'Comic Neue','Comic Sans MS','Chalkboard SE',cursive;color:var(--txt);min-height:100vh;
background:radial-gradient(900px 500px at 80% -10%,rgba(var(--glow),.18),transparent),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
background:linear-gradient(rgba(var(--glow),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--glow),.07) 1px,transparent 1px);background-size:44px 44px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)}
.w{position:relative;max-width:900px;margin:auto;padding:14px 16px 90px;z-index:1}
h1,h2,h3,.o{font-family:Bangers,Impact,'Comic Sans MS',cursive;font-weight:400;letter-spacing:.06em}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0 14px}
.logo{font:400 23px Bangers,Impact,cursive;color:var(--acc);text-shadow:0 0 14px rgba(var(--glow),.7);cursor:pointer;background:none;border:0}
.th{display:flex;gap:8px;align-items:center}
.th span{font-size:16px;color:var(--mut);text-transform:uppercase}
.th button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.th button.on{border-color:var(--txt);box-shadow:0 0 10px var(--acc)}
.card{background:var(--pan);border:1px solid var(--line);padding:14px 16px;margin:12px 0;position:relative;
clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));box-shadow:inset 0 0 30px rgba(var(--glow),.06)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc)}
.hero h1{font-size:clamp(34px,8vw,52px);color:var(--acc);text-shadow:0 0 18px rgba(var(--glow),.6)}
.hero p,.mut{color:var(--mut)}
.team{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.mon{display:flex;flex-direction:column;align-items:center;font-size:17px;gap:2px}
.ball{width:62px;height:62px;border-radius:50%;border:2px solid var(--c,var(--acc));background:rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 12px -2px var(--c,var(--acc))}
.ball img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.ball b{font:400 25px Bangers,Impact,cursive;color:var(--c)}
.btn{font:400 20px Bangers,Impact,cursive;letter-spacing:.05em;text-transform:uppercase;color:#120804;background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;padding:12px 18px;cursor:pointer;
clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 18px rgba(var(--glow),.45)}
.btn.g{background:transparent;color:var(--acc);outline:1px solid var(--line);outline-offset:-1px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.row:hover{border-color:var(--acc)}
.row h3{font-size:24px}.row small{color:var(--mut);font-size:18px}
.go{margin-left:auto;color:var(--acc);font:400 25px Bangers,Impact,cursive}
.bar{height:6px;background:rgba(127,127,127,.25);margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 8px var(--acc)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.nav.c{justify-content:center;gap:12px}
.nav.c .btn{flex:0 1 auto}
.lnk{background:none;border:0;color:var(--mut);font:700 18px 'Comic Neue',cursive;cursor:pointer}
.lnk:hover{color:var(--acc)}
.lead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lead>span{color:var(--mut)}
.st{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:36px;height:36px;display:grid;place-items:center;font:400 20px Bangers,Impact,cursive;color:#120804;background:var(--acc);border-radius:50%;box-shadow:0 0 12px var(--acc)}
.tag{font:400 18px Bangers,Impact,cursive;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.n .tag{color:#4fc3ff}.a{border-color:#a8321f}.a .tag{color:#ff6a4f}.j .tag{color:var(--acc2)}.p{border-style:dashed}.p .tag{color:var(--mut)}
.fly{color:var(--txt)}.fly b{color:var(--acc)}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.vars button{font:400 19px Bangers,Impact,cursive;padding:9px 14px;cursor:pointer;color:var(--txt);background:var(--pan);border:1px solid var(--line)}
.vars button.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(var(--glow),.4)}
.m{font-weight:700}
.tr{height:56px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(var(--glow),.55))}.tr.s{height:44px}.gh{display:flex;align-items:center;gap:14px;margin:10px 0 2px}
h2.sec{font-size:15px;color:var(--acc);margin:22px 0 4px;text-transform:uppercase}
.rg{display:grid;gap:0}
</style>
</head>

 app.innerHTML=`<section class="card hero"><span class="mut o" style="font-size:16px">RERUN DE GIMNASIOS · POKEMMO</span><h1>PREHISTÓRICO 5</h1>
 <p>Guía paso a paso para farmear los ${tot} gimnasios con este equipo.</p><div class="team">${Object.keys(MONS).map(ball).join('')}</div>
  <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="location.hash='#/r/hoenn'">Empieza el rerun ›</button></div></section>
 <h2 class="sec o">Empieza por Hoenn</h2><div class="rg">${REG.map(r=>`<button class="card row" onclick="location.hash='#/r/${r.id}'"><div><h3 class="o">${r.n}</h3><small>${r.g.length} gimnasios</small></div><span class="go">›</span></button>`).join('')}</div>`}
function region(id){const r=REG.find(x=>x.id===id);if(!r)return home();
 app.innerHTML=`<div class="nav"><button class="lnk" onclick="location.hash='#/'">‹ Inicio</button></div><h2 class="o" style="font-size:34px;color:var(--acc)">Gimnasios de ${r.n}</h2>
 ${r.g.map((g,i)=>`<button class="card row" onclick="location.hash='#/g/${r.id}/${i}'"><span class="num">${i+1}</span>${tim(r.id,i,0,'s')}<div><h3 class="o" style="font-size:23px">${g.n}</h3><small>${g.v?g.v.length+' variantes':'Ver guía'}</small></div><span class="go">›</span></button>`).join('')}`}
function gym(id,i,vi){const r=REG.find(x=>x.id===id),g=r&&r.g[i];if(!g)return home();
 const v=g.v?g.v[vi||0]:g,ri=REG.indexOf(r),last=i===r.g.length-1,nx=REG[ri+1];
 const box=(c,t,x)=>`<div class="card ${c}"><span class="tag">${TN[c]||''}</span>${hl(x)}</div>`;
 const lead=v.l?`<div class="card"><div class="lead"><span>Lidera con:</span>${v.l.map(ball).join('')}</div></div>`:'';
 app.innerHTML=`<div class="nav"><button class="lnk" onclick="location.hash='#/r/${id}'">‹ Gimnasios de ${r.n}</button><button class="lnk" onclick="location.hash='#/'">Inicio</button></div>
 <div class="gh">${tim(id,i,vi)}<div><h2 class="o" style="font-size:clamp(30px,7vw,42px);color:var(--acc2);margin:0 0 2px">${g.n.toUpperCase()}</h2>
 <div class="mut o" style="font-size:16px">RERUN — ${r.n.toUpperCase()} · ${i+1}/${r.g.length}</div></div></div>
 ${g.v?`<p class="mut" style="margin-top:8px">${g.q}</p><div class="vars">${g.v.map((x,k)=>`<button class="${k===(vi||0)?'on':''}" onclick="location.hash='#/g/${id}/${i}/${k}'">${x.k}</button>`).join('')}</div>`:''}
 ${lead}${(v.j||[]).map(x=>box('j','',x)).join('')}
 ${v.s.map((s,k)=>`<div class="card"><div class="st"><span class="num">${k+1}</span><div><span class="tag" style="color:var(--acc)">Paso</span>${hl(s)}</div></div></div>`).join('')}
 ${(v.t||[]).map(([c,x])=>box(c,'',x)).join('')}
 ${v.f?`<div class="card fly">✈ <span class="mut">¿Olvidaste a dónde ir? Mira abajo:</span><br><b>VUELA A: ${esc(v.f.toUpperCase())}</b></div>`:''}
 <div class="card"><div class="nav c">
  <button class="btn g" ${i===0?'disabled':''} onclick="location.hash='#/g/${id}/${i-1}'">‹ Gimnasio anterior</button>
  ${g.end?`<button class="btn" onclick="location.hash='#/'">¡Rerun completado! Volver al inicio</button>`:
  last?`<button class="btn" onclick="location.hash='#/r/${nx.id}'">Siguiente región: ${nx.n} ›</button>`:`<button class="btn" onclick="location.hash='#/g/${id}/${i+1}'">Siguiente gimnasio ›</button>`}
 </div></div>`}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
 if(p[0]==='r')region(p[1]);else if(p[0]==='g')gym(p[1],+p[2],+p[3]||0);else home()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
